<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-label="Vibe demo: running a repo with one command">
<style>
.line { opacity: 0; animation: fadein .45s ease forwards; }
@keyframes fadein { to { opacity: 1; } }
.cursor { animation: blink 1.1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
</style>
<rect width="780" height="420" rx="12" fill="#0d1117"/>
<circle cx="28" cy="26" r="7" fill="#ff5f57"/><circle cx="52" cy="26" r="7" fill="#febc2e"/><circle cx="76" cy="26" r="7" fill="#28c840"/>
<text x="110" y="31" fill="#8b949e" font-size="13">vibe — zsh</text>
<line x1="0" y1="46" x2="780" y2="46" stroke="#21262d"/>

<text x='32' y='82' fill='#e6edf3' class='line' style='animation-delay:0.4s'>$ npx -y abicevoice1-sudo/vibe abicevoice1-sudo/vibe-demo</text>
<text x='32' y='134' fill='#8b949e' class='line' style='animation-delay:1.1s'>vibe v0.1.0 — zero-touch execution engine</text>
<text x='32' y='160' fill='#3fb950' class='line' style='animation-delay:1.9s'>✔ Cloned into ~/.vibe/runs/vibe-demo</text>
<text x='32' y='212' fill='#e6edf3' font-weight='bold' class='line' style='animation-delay:2.6s'>Detected  Node.js</text>
<text x='32' y='238' fill='#8b949e' class='line' style='animation-delay:3.4s'>Command   npm start</text>
<text x='32' y='264' fill='#8b949e' class='line' style='animation-delay:4.2s'>  [install] added 68 packages in 9s</text>
<text x='32' y='290' fill='#3fb950' class='line' style='animation-delay:4.9s'>✔ npm install</text>
<text x='32' y='342' fill='#e6edf3' class='line' style='animation-delay:5.7s'>Starting: npm start  (PORT=3497)</text>
<text x='32' y='368' fill='#3fb950' font-weight='bold' class='line' style='animation-delay:6.4s'>  🚀 Running at http://localhost:3497</text>
<text x='32' y='394' fill='#8b949e' class='line' style='animation-delay:7.2s'>  Press Ctrl+C to stop.</text>
<rect x='32' y='402' width='9' height='17' fill='#3fb950' class='cursor' style='animation-delay:7.9s'/>
</svg>